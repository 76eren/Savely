<app-auth-shell titleId="register-title">
  <header class="relative mb-8">
    <span class="absolute -top-[18px] -left-5 hidden size-[15px] border-t-2 border-l-2 border-[#0aa9aa] sm:block" aria-hidden="true"></span>
    <span class="absolute -top-[18px] -right-1 hidden size-[15px] border-t-2 border-r-2 border-[#0aa9aa] sm:block" aria-hidden="true"></span>
    <h1 id="register-title" class="mb-2.5 text-[clamp(1.875rem,3vw,2.5rem)] leading-[1.08] font-bold tracking-[-0.045em] text-white">Create your account</h1>
  </header>

  <form class="space-y-4" (submit)="$event.preventDefault()">
    <app-auth-field
      id="username"
      label="Username"
      name="username"
      autocomplete="username"
      placeholder="kingjulian22"
      [minLength]="3"
      [(value)]="username"
    />

    <app-auth-field
      id="display-name"
      label="Display name"
      name="displayName"
      autocomplete="name"
      placeholder="King Julian"
      [(value)]="displayName"
    />

    <app-auth-field
      id="email"
      label="Email address"
      name="email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
      [(value)]="email"
    />

    <app-auth-field
      id="password"
      label="Password"
      name="password"
      type="password"
      autocomplete="new-password"
      placeholder="Create a password"
      [minLength]="8"
      [(value)]="password"
    />

    <button
      (click)="this.signUp()"
      class="mt-6 min-h-[54px] w-full cursor-pointer rounded-full border-0 bg-[#0aa9aa] text-[13px] font-extrabold tracking-[0.06em] text-white uppercase transition-colors hover:bg-[#0b9899]" type="submit">Create account</button>
  </form>

  <p class="mt-5 text-center text-[13px] text-[#7e898e]">
    Already have an account?
    <a class="text-xs font-semibold text-[#0aa9aa] no-underline hover:underline" routerLink="/login">Sign in</a>
  </p>
</app-auth-shell>
