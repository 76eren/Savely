<main class="min-h-dvh bg-[#151515] text-slate-50 [font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe_UI',sans-serif]">
  <section class="grid min-h-dvh lg:grid-cols-2" [attr.aria-labelledby]="titleId">

    <div
      class="relative isolate hidden min-h-dvh flex-col justify-between overflow-hidden bg-[#123f44]
      bg-cover bg-center p-[clamp(2.5rem,4vw,4rem)] before:absolute before:inset-0 before:-z-10
      before:bg-[linear-gradient(180deg,rgba(4,15,18,0.38),rgba(2,10,12,0.26)_38%,rgba(2,9,12,0.82))] lg:flex"
      [style.background-image]="wallpaper ? 'url(&quot;' + wallpaper + '&quot;)' : null"
    >
      <div class="mt-auto max-w-[520px] lg:mb-12">
        <h2 class="mb-0 text-4xl leading-[0.98] font-bold tracking-[-0.055em] sm:mb-[18px] sm:text-5xl lg:text-[clamp(3rem,5vw,4.5rem)]">Savely</h2>
        <p class="hidden max-w-[450px] text-[clamp(1rem,1.7vw,1.25rem)] leading-[1.55] text-white/80 sm:block">
          Now you can keep your save files in a structured manner!
        </p>
      </div>
    </div>

    <div class="grid min-h-dvh place-items-center bg-[#151515] px-6 py-8 sm:px-10 sm:py-12 lg:px-[clamp(2.5rem,6vw,5rem)]">

      <div class="w-full max-w-[430px]">
        <ng-content />
      </div>
    </div>
  </section>
</main>
