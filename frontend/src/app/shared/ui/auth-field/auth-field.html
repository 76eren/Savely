<div class="mb-2 flex items-baseline justify-between">
  <label class="text-[13px] font-semibold text-[#dfe5e7]" [for]="id">{{ label }}</label>
  @if (showForgotPassword) {
    <a class="text-xs font-semibold text-[#0aa9aa] no-underline hover:underline" href="#">Forgot password?</a>
  }
</div>

<div class="flex h-[54px] items-center gap-3 rounded-[10px] border border-[#2a3033] bg-[#1d1d1d] px-4 focus-within:outline-1 focus-within:-outline-offset-1 focus-within:outline-[#0aa9aa]">
  <input
    class="min-w-0 flex-1 border-0 bg-transparent text-sm text-white outline-0 placeholder:opacity-35"
    [value]="value()"
    (input)="value.set($any($event.target).value)"
    [id]="id"
    [name]="name"
    [type]="inputType"
    [attr.autocomplete]="autocomplete"
    [placeholder]="placeholder"
    [attr.minlength]="minLength"
    required
  />

  @if (type === 'password') {
    <button
      class="grid cursor-pointer place-items-center border-0 bg-transparent p-1"
      type="button"
      (click)="passwordVisible = !passwordVisible"
      [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="passwordVisible"
    >
      <svg class="w-[19px] fill-none stroke-[#69757b] stroke-[1.7] hover:stroke-[#d6dfe1] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="2.5" />
      </svg>
    </button>
  }
</div>
